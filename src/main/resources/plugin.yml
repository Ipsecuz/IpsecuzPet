name: IpsecuzPet
version: 2.1
main: org.ipsecuz.pet.IpsecuzPet
api-version: 1.19
folia-supported: true
authors: [Ipsecuz]
description: Plugin Pet RPG System - Stats, Duel, Mount, Shop, Hatching, Skills, Modules.
softdepend: [BetterModel, ModelEngine, Vault, PlayerPoints, ItemsAdder, Oraxen, Nexo, Citizens, FancyNpcs]
commands:
  ipsecuzpet:
    description: Lệnh chính của hệ thống Pet
    usage: |
      §cSai cú pháp! Hãy thử:
      §e/pet help §7- Xem danh sách lệnh
      §e/pet shop §7- Mua pet mới
      §e/pet hatch §7- Mở Lò Ấp Trứng
      §e/pet baby §7- Đổi kích thước Bé con/Trưởng thành
      §e/pet despawn §7- Cất pet đi
      §e/pet duel <tên> §7- Thách đấu
    aliases: [pet, pethatch]
    permission: ipsecuzpet.use
    permission-message: "§cBạn không có quyền sử dụng lệnh này!"

permissions:
  ipsecuzpet.use:
    description: Cho phép người chơi dùng các lệnh cơ bản (menu, duel, help, baby, despawn)
    default: true

  ipsecuzpet.shop:
    description: Cho phép mở cửa hàng thú cưng (Pet Shop)
    default: true

  ipsecuzpet.codex:
    description: Cho phép mở từ điển thú cưng (Pet Codex)
    default: true

  ipsecuzpet.shards:
    description: Cho phép mở giao diện mảnh thú cưng (Pet Shards)
    default: true

  ipsecuzpet.feed:
    description: Cho phép cho thú cưng ăn
    default: true

  ipsecuzpet.skill:
    description: Cho phép kích hoạt tuyệt chiêu kỹ năng của thú cưng
    default: true

  ipsecuzpet.evolution:
    description: Cho phép nâng cấp sao / tiến hóa thú cưng
    default: true

  ipsecuzpet.rename:
    description: Cho phép người chơi đổi tên thú cưng của mình
    default: true

  ipsecuzpet.withdraw:
    description: Cho phép rút thú cưng thành Thẻ Pet vật phẩm an toàn
    default: true

  ipsecuzpet.trade:
    description: Cho phép giao dịch thú cưng qua sàn Trade GUI hai chiều
    default: true

  ipsecuzpet.ride:
    description: Cho phép cưỡi thú cưng
    default: true

  ipsecuzpet.hatch:
    description: Cho phép mở Lò Ấp Trứng và quay Gacha Roulette
    default: true

  ipsecuzpet.multiplier.1.5:
    description: Tăng 1.5x kinh nghiệm nhận được cho thú cưng
    default: false

  ipsecuzpet.multiplier.2.0:
    description: Tăng 2.0x kinh nghiệm nhận được cho thú cưng
    default: false

  ipsecuzpet.catch.vip:
    description: Tăng tỷ lệ bắt thú cưng cấp VIP
    default: false

  ipsecuzpet.catch.mvp:
    description: Tăng tỷ lệ bắt thú cưng cấp MVP
    default: false

  ipsecuzpet.model.status:
    description: Cho phép xem trạng thái ModelEngine/BetterModel
    default: op

  ipsecuzpet.admin:
    description: Quyền Quản trị viên (toàn quyền)
    default: op