    mvp: 20.0 # -> Perm: ipsecuzpet.catch.mvp
    #...

  items:
    basic_ball:
      material: EGG
      name: "&f⚪ Bóng Cơ Bản"
      lore:
        - "&7Tỉ lệ bắt: &f20%"
        - "&7Chỉ bắt được thú hiền lành."
      base_chance: 20.0

      # MODE: Chọn 'WHITELIST' (Chỉ cho bắt danh sách dưới)
      #       hoặc 'BLACKLIST' (Cấm bắt danh sách dưới, còn lại bắt được hết)
