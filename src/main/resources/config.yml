        - "&7Tỉ lệ bắt: &e50%"
        - "&7Bắt được mọi thứ trừ Boss!"
      base_chance: 50.0

      # BLACKLIST: Cấm bắt Boss, còn lại bắt được tuốt
      mode: BLACKLIST
      types:
        - WITHER
        - ENDER_DRAGON
        - WARDEN

    master_ball:
      material: SLIME_BALL
      name: "&d🟣 Master Ball"
