# ==========================================================
#               IPSECUZ PETS - CONFIGURATION
# ==========================================================
# Giới hạn số lượng Pet tối đa một người chơi có thể sở hữu
max_pets: 2

# ==========================================================
#               HỆ THỐNG RPG & CẤP ĐỘ
# ==========================================================
rpg_system:
  max_level: 100

  # EXP cần thiết = Level hiện tại * base_exp_requirement
  base_exp_requirement: 50

  # EXP nhận được khi chủ giết 1 con quái (Mob)
  exp_per_kill: 10
  # Người chơi có quyền 'ipsecuzpet.multiplier.1.5' sẽ nhận 1.5x kinh nghiệm
  xp_multiplier_permissions:
    ipsecuzpet.multiplier.1.5: 1.5
    ipsecuzpet.multiplier.2.0: 2.0

  # Số lượng quặng Kim Cương cần đào để hồi sinh 1 con Pet chết
  revive_cost_diamonds: 32

  # Chỉ số cộng thêm mỗi khi Pet lên 1 Level
  # Công thức: Chỉ số gốc + (Level * Giá trị này)
  default_growth:
    damage: 0.5   # Tăng 0.5 dame/cấp
    health: 2.0   # Tăng 2 máu/cấp
    defense: 0.2  # Tăng 0.2 giáp/cấp
    speed: 0.001  # Tăng tốc chạy
    intelligence: 0.5 # Tăng hiệu quả buffww
  # Quà tặng khi Pet lên cấp (Buff cho chủ trong thời gian ngắn)
  level_up_rewards:
    duration: 120 # Giây
    effects:
      - "SPEED:1"
      - "INCREASE_DAMAGE:1"
      - "REGENERATION:0"

