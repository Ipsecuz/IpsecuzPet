# ==========================================================
#               MODULE: TIẾN HÓA & TĂNG SAO (EVOLUTION)
# ==========================================================
enabled: true

# Số sao tối đa
max_stars: 5

# Tỉ lệ tăng chỉ số mỗi cấp sao cho Máu, Sát thương, Giáp (0.15 = +15%)
stat_boost_per_star: 0.15

# Tỉ lệ tăng tốc độ chạy mỗi cấp sao (mặc định 0.0 để giữ thăng bằng vận tốc di chuyển)
speed_boost_per_star: 0.0

# ==========================================================
# HỆ THỐNG YÊU CẦU ĐA NĂNG (UNIVERSAL REQUIREMENT ENGINE)
# Hỗ trợ:
# - all: Tất cả điều kiện đều bắt buộc (AND)
# - one_of: Chỉ cần thỏa mãn 1 trong các hình thức chi phí (OR)
# - Các loại: PET_LEVEL, PET_STAR, MONEY, POINTS, ITEM (Vanilla, ItemsAdder, Oraxen, Nexo), PERMISSION, PET_OWNED, PET_NOT_OWNED
# - Tương thích ngược: Vẫn nhận diện các key cũ (min_level, cost_money, cost_diamonds, cost_netherite, cost_items)
# ==========================================================
