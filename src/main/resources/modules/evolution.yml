# ==========================================================
#               MODULE: TIẾN HÓA & TĂNG SAO (EVOLUTION)
# ==========================================================
enabled: true

# Số sao tối đa
max_stars: 5

# Tỉ lệ tăng chỉ số mỗi cấp sao cho Máu, Sát thương, Giáp (0.15 = +15%)
stat_boost_per_star: 0.15

# Tỉ lệ tăng tốc độ chạy mỗi cấp sao (mặc định 0.0 để giữ thăng bằng vận tốc di chuyển)
speed_boost_per_star: 0.0

# Yêu cầu để tăng sao
requirements:
  star_2:
    min_level: 20
    cost_money: 10000
    cost_diamonds: 16
  star_3:
    min_level: 40
    cost_money: 30000
    cost_diamonds: 32
  star_4:
    min_level: 60
    cost_money: 75000
    cost_netherite: 2
  star_5:
    min_level: 80
    cost_money: 150000
    cost_netherite: 4

