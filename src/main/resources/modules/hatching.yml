# ==========================================================
#               MODULE: HỆ THỐNG ẤP TRỨNG & QUAY GACHA PET
# ==========================================================
enabled: true

# Tiêu đề GUI Ấp trứng
gui:
  title: "&#00AAFF✦ Lò Ấp Trứng Thú Cưng ✦"
  size: 45
  # Cho phép hỗ trợ liên kết với FancyNPCs / Citizens / ZNPCs qua lệnh: /pet hatch

# Danh sách các loại trứng có thể tìm thấy, quay thưởng hoặc mua
# HỖ TRỢ ĐA NỀN TẢNG:
# - material: EGG, TURTLE_EGG, DRAGON_EGG hoặc custom:
#   + "itemsadder:custom_egg_item"
#   + "oraxen:custom_egg_item"
#   + "nexo:custom_egg_item"
# - requirements (Điều kiện chi phí để quay Gacha ấp trứng):
#   + money: Số tiền Vault cần có (ví dụ: 1000)
#   + points: Số PlayerPoints cần có (ví dụ: 10)
#   + items: Danh sách vật phẩm cần nộp (Hỗ trợ Vanilla, ItemsAdder, Oraxen, Nexo)
eggs:
  common_egg:
    name: "&a🥚 Trứng Thường (Common Egg)"
    material: EGG
    requirements:
      money: 500
      points: 0
      items:
        - "WHEAT:10"
    lore:
      - "&7Độ hiếm: &aPhổ Thông"
      - "&7Chứa đựng linh hồn các loài thú hiền lành."
      - "&f"
      - "&e✦ Danh sách Pet có thể nở:"
      - " &7- Gà Con Lon Ton (&a35%&7)"
      - " &7- Heo Ủn Ỉn (&a30%&7)"
      - " &7- Bò Sữa (&a20%&7)"
      - " &7- Cừu Bông (&a15%&7)"
      - "&f"
      - "&6▶ Nhấp chuột phải hoặc đặt vào Lò Ấp để mở!"
    loot_table:
      chicken_pet: 35
      pig_pet: 30
      cow_pet: 20
      sheep_pet: 15

  rare_egg:
    name: "&b🔮 Trứng Hiếm (Rare Egg)"
    material: TURTLE_EGG
    requirements:
      money: 3000
      points: 10
      items:
        - "DIAMOND:2"
        # - "itemsadder:ruby:1"      # Hỗ trợ vật phẩm từ ItemsAdder
        # - "oraxen:sapphire:1"     # Hỗ trợ vật phẩm từ Oraxen
        # - "nexo:amethyst_core:1"  # Hỗ trợ vật phẩm từ Nexo
    lore:
      - "&7Độ hiếm: &bHiếm"
      - "&7Ấp nở những trợ thủ đắc lực."
      - "&f"
      - "&e✦ Danh sách Pet có thể nở:"
      - " &7- Sói Chiến Binh (&b35%&7)"
      - " &7- Mèo May Mắn (&b30%&7)"
      - " &7- Cáo Tuyết (&b20%&7)"
      - " &7- Golem Sắt Bảo Vệ (&b15%&7)"
      - "&f"
      - "&6▶ Nhấp chuột phải hoặc đặt vào Lò Ấp để mở!"
    loot_table:
      wolf_pet: 35
      cat_pet: 30
      fox_pet: 20
      iron_golem_pet: 15

  legendary_egg:
    name: "&6👑 Trứng Thần Thoại (Legendary Egg)"
    material: DRAGON_EGG
    requirements:
      all:
        - type: ITEM
          id: DIAMOND
          amount: 5
      one_of:
        - type: MONEY
          amount: 10000
        - type: POINTS
          amount: 50
        - type: ITEM
          id: NETHERITE_INGOT
          amount: 1
    lore:
      - "&7Độ hiếm: &6Thần Thoại"
      - "&7Chứa đựng sức mạnh của các cổ thú tối thượng!"
      - "&f"
      - "&e✦ Danh sách Pet có thể nở:"
      - " &7- Tiểu Tiên Nữ Allay (&640%&7)"
      - " &7- Kẻ Cai Ngục Warden (&625%&7)"
      - " &7- Rồng Ender (&620%&7)"
      - " &7- Chúa Tể Wither (&615%&7)"
      - "&f"
      - "&6▶ Nhấp chuột phải hoặc đặt vào Lò Ấp để mở!"
    loot_table:
      allay_pet: 40
      warden_pet: 25
      ender_dragon_pet: 20
      wither_pet: 15

# Tỉ lệ rơi trứng khi đào khoáng và đánh quái
drops:
  mining:
    enabled: true
    chance_percent: 1.5
    diamond_ore_egg: "rare_egg"
    ancient_debris_egg: "legendary_egg"
  mobs:
    enabled: true
    boss_chance_percent: 25.0
    boss_egg: "legendary_egg"
    monster_chance_percent: 0.5
    monster_egg: "common_egg"
