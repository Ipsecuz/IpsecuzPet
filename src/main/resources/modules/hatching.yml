# Tỉ lệ rơi trứng khi đào khoáng và đánh quái
drops:
  mining:
    enabled: true
    chance_percent: 1.5
    diamond_ore_egg: "rare_egg"
    ancient_debris_egg: "legendary_egg"
  mobs:
    enabled: true
    boss_chance_percent: 25.0
    boss_egg: "legendary_egg"
    monster_chance_percent: 0.5
    monster_egg: "common_egg"

